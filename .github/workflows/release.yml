name: Build and Release

# 推送 v* 标签时触发：构建壁纸与绿色单文件 LyricServer.exe 并发布到 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 并上传资产所需

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true # 快速连续打 tag 时，取消仍在进行中的旧构建

jobs:
  build-server:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build portable LyricServer
        shell: pwsh
        run: ./scripts/build-lyric-server.ps1 -Clean

      - name: Upload LyricServer artifact
        uses: actions/upload-artifact@v7
        with:
          name: lyric-server-exe
          path: release/LyricServer.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-server
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The upstream dependency contains an unconfigured nested submodule.
          # Initialize only our direct dependency below, without recursion.
          submodules: false
          fetch-depth: 0    # 拉取完整历史，确保子模块能正确检出

      - name: Initialize wallpaper renderer dependency
        run: git submodule update --init wallpaper/vendor/liquid-glass-webgl

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallpaper/package-lock.json

      - name: Install wallpaper dependencies
        working-directory: wallpaper
        run: npm ci

      - name: Build wallpaper
        working-directory: wallpaper
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package wallpaper
        run: |
          test -f dist/index.html || { echo "构建产物缺失 dist/index.html"; exit 1; }
          cd dist
          zip -r "../wallpaper-v${{ steps.version.outputs.version }}.zip" .

      - name: Download portable LyricServer
        uses: actions/download-artifact@v7
        with:
          name: lyric-server-exe
          path: release

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            wallpaper-v${{ steps.version.outputs.version }}.zip
            release/LyricServer.exe
            THIRD_PARTY_NOTICES.md
