name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build standalone wallpaper
        shell: pwsh
        run: ./scripts/build-native-wallpaper.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: lyric-wallpaper-win-x64
          path: release/LyricWallpaper-win-x64.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-native
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: lyric-wallpaper-win-x64
          path: release

      - name: Publish Windows release
        uses: softprops/action-gh-release@v3
        with:
          name: "歌词壁纸 ${{ github.ref_name }} · Windows 独立版"
          body: |
            下载并运行 `LyricWallpaper-win-x64.exe`。双击托盘图标打开设置。
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/LyricWallpaper-win-x64.exe
