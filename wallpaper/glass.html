<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Liquid Lyrics</title>
  </head>
  <body>
    <div id="scene">
      <canvas id="liquid-canvas" aria-hidden="true"></canvas>
      <main id="fallback-lyrics" aria-label="滚动歌词"></main>

    <div id="offline" class="offline" hidden>

        <div class="offline-spinner"></div>
        <div class="offline-text">Waiting for Now Playing…</div>
      </div>
    </div>
    <aside id="liquid-controls" aria-label="液态玻璃参数"></aside>
    <script type="module" src="/src/liquid/main.ts"></script>
  </body>
</html>
