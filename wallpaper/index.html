<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Lyrics Wallpaper</title>
</head>
<body>
  <!-- 场景层：包含背景与歌词，播放时淡入显示，不播放时淡出隐藏 -->
  <div id="scene">
    <div id="bg"></div>
    <div id="lyrics" class="lyrics" aria-hidden="true"></div>
  </div>

  <!-- 极简连接状态层：API 不可用时提示，避免白屏 -->
  <div id="offline" class="offline" hidden>
    <div class="offline-inner">
      <div class="offline-spinner"></div>
      <div class="offline-text">Waiting for Now Playing…</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
